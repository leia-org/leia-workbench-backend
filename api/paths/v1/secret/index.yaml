post:
  tags:
    - Secret v1
  summary: Validate the admin secret
  operationId: checkSecret
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/secret/checkSecretRequest.yaml'
  responses:
    '200':
      description: Secret is valid
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/successMessage.yaml'
    '400':
      description: Secret is required
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/successMessage.yaml'
    '403':
      description: Secret is invalid
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/successMessage.yaml'

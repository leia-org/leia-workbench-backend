patch:
  tags:
    - Replications v1
  summary: Configure student access to an earlier stage conversation for a stage (n>1)
  operationId: updateStagePreviousConversation
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier for the replication
      schema:
        $ref: '../../../components/schemas/mongoId.yaml'
    - name: stageId
      in: path
      required: true
      description: Unique identifier for the target stage (must not be the first stage)
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - enabled
          properties:
            enabled:
              type: boolean
            sourceStageId:
              type: string
              nullable: true
            availability:
              type: string
              enum:
                - chat
                - both
  responses:
    '200':
      description: Successful response with updated Replication
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/replication/replication.yaml'
    '400':
      description: Invalid stage configuration
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/errorResponse.yaml'
    '404':
      description: Replication or stage not found
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/errorResponse.yaml'

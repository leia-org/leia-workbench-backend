patch:
  tags:
    - Replications v1
  summary: Configure per-LEIA student access to earlier stage conversation and submitted solution (stages n>1)
  operationId: updateLeiaPreviousStageView
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier for the replication
      schema:
        $ref: '../../../components/schemas/mongoId.yaml'
    - name: leiaId
      in: path
      required: true
      description: Unique identifier for the target LEIA in a stage after the first
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            previousConversation:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                sourceStageId:
                  type: string
                  nullable: true
                availability:
                  type: string
                  enum:
                    - chat
                    - editor
                    - both
            previousSubmittedSolution:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                sourceStageId:
                  type: string
                  nullable: true
                availability:
                  type: string
                  enum:
                    - chat
                    - editor
                    - both
            applyToStage:
              type: boolean
              description: When true on a single-mode stage, applies the same update to all LEIAs in the stage.
  responses:
    '200':
      description: Successful response with updated Replication
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/replication/replication.yaml'
    '400':
      description: Invalid stage or LEIA configuration
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/errorResponse.yaml'
    '404':
      description: Replication, stage, or LEIA not found
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/errorResponse.yaml'

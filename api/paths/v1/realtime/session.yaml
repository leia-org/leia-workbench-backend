post:
  tags:
    - Realtime v1
  summary: Create a realtime WebRTC session
  operationId: createRealtimeSession
  parameters:
    - name: X-Session-Id
      in: header
      required: true
      description: Workbench session identifier
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/sdp:
        schema:
          type: string
      text/plain:
        schema:
          type: string
  responses:
    '200':
      description: Realtime session created successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/realtime/sessionResponse.yaml'

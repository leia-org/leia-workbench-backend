post:
  tags:
    - Realtime v1
  summary: Create a Luke WebSocket auth token
  operationId: createLukeToken
  parameters:
    - name: sessionId
      in: path
      required: true
      description: Workbench session identifier
      schema:
        type: string
  responses:
    '200':
      description: Luke token created successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/realtime/lukeTokenResponse.yaml'

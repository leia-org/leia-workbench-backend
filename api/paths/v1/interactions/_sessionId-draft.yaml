post:
  tags:
    - Interactions v1
  summary: Save a draft for a session
  operationId: saveDraft
  parameters:
    - name: sessionId
      in: path
      required: true
      description: The ID of the session
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/interaction/saveDraftRequest.yaml'
  responses:
    '200':
      description: Draft saved successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/interaction/session.yaml'

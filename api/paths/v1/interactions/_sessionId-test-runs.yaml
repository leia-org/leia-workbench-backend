post:
  tags:
    - Interactions v1
  summary: Record a test run of the code editor
  description: >
    Called by the code editor widget after every execution of the test suite,
    whether the student or the LEIA started it.
  operationId: createTestRun
  parameters:
    - name: sessionId
      in: path
      required: true
      description: The ID of the session
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/interaction/createTestRunRequest.yaml'
  responses:
    '201':
      description: Test run stored
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
              createdAt:
                type: string
                format: date-time
    '200':
      description: A run with the same clientRunId was already stored
    '400':
      description: Validation error
    '403':
      description: The session is already finished
    '404':
      description: Session not found
    '409':
      description: The activity has no code editor
    '429':
      description: Too many test runs for this session

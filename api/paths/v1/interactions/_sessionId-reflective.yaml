post:
  tags: [Interactions v1]
  summary: Continue to the next LEIA using the previous conversation
  description: Loads the previous conversation and any submitted solution server-side. Retries return the same continuation.
  operationId: startReflectiveSession
  security: []
  parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
  responses:
    '201':
      description: New or existing continuation session ID.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/interaction/sessionIdResponse.yaml'
    '400':
      description: The preceding session is unfinished or no contextual LEIA follows it.
    '403':
      description: Replication is inactive.
    '404':
      description: Previous session does not exist.

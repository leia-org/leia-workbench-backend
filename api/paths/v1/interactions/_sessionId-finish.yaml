post:
  tags:
    - Interactions v1
  summary: Finish the session without saving any results
  operationId: finishSession
  parameters:
    - name: sessionId
      in: path
      required: true
      description: The ID of the session to update data for
      schema:
        type: string
  responses:
    '200':
      description: Session data updated successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/interaction/session.yaml'

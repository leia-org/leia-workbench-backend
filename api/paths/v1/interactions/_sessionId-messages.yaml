post:
  tags:
    - Interactions v1
  summary: Send a message to the leia in your session and get the response
  operationId: sendSessionMessage
  parameters:
    - name: sessionId
      in: path
      required: true
      description: The ID of the session to send the message to
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/interaction/sendMessageRequest.yaml'
  responses:
    '200':
      description: Message sent successfully, and response received
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/interaction/sendMessageResponse.yaml'

post:
  tags:
    - Interactions v1
  summary: Save the result of a session and finish it
  operationId: saveResultAndFinishSession
  parameters:
    - name: sessionId
      in: path
      required: true
      description: The ID of the session to update data for
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/interaction/saveResultRequest.yaml'
  responses:
    '200':
      description: Session data updated successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/interaction/session.yaml'

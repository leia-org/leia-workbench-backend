get:
  tags:
    - Spectator v1
  summary: Retrieve session data for a spectator
  operationId: getSessionForSpectator
  parameters:
    - name: id
      in: path
      required: true
      description: Workbench session identifier
      schema:
        type: string
    - name: token
      in: query
      required: false
      description: Spectate token. Required unless `x-spectate-token` is provided.
      schema:
        type: string
    - name: x-spectate-token
      in: header
      required: false
      description: Alternative header for the spectate token
      schema:
        type: string
  security: []
  responses:
    '200':
      description: Session data retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/schemas/v1/interaction/sessionData.yaml'
              - type: object
                properties:
                  runStages:
                    type: array
                    description: Ordered summaries of stages reached so far in the same ActivityRun.
                    items:
                      type: object
                      properties:
                        sessionId:
                          type: string
                        stageId:
                          type: string
                          nullable: true
                        stageIndex:
                          type: integer
                        stageNumber:
                          type: integer
                        stageTotal:
                          type: integer
                        startedAt:
                          type: string
                          format: date-time
                        finishedAt:
                          type: string
                          format: date-time
                          nullable: true
                        isActive:
                          type: boolean
                        messageCount:
                          type: integer
                        hasSubmittedSolution:
                          type: boolean
                        mode:
                          type: string
                        leiaName:
                          type: string
                          nullable: true

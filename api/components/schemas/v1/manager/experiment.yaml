type: object
description: Experiment payload as returned by the Manager service.
required:
  - stages
properties:
  id:
    type: string
    description: Unique identifier for the experiment.
  name:
    type: string
  leias:
    type: array
    items:
      $ref: './leia.yaml'
  stages:
    type: array
    minItems: 1
    description: Ordered stage definitions.
    items:
      type: object
      properties:
        id:
          type: string
          format: uuid
        outputSources:
          type: object
          properties:
            conversation:
              type: string
              format: uuid
              nullable: true
            submitedSolution:
              type: string
              format: uuid
              nullable: true
        orchestration:
          $ref: './orchestration.yaml'

type: object
description: Experiment payload as returned by the Manager service.
properties:
  id:
    type: string
    description: Unique identifier for the experiment.
  name:
    type: string
  leias:
    type: array
    items:
      $ref: './leia.yaml'
  orchestration:
    $ref: './orchestration.yaml'
  stages:
    type: array
    description: Ordered stage definitions. Absent on legacy activities.
    items:
      type: object
      properties:
        id:
          type: string
          format: uuid
        previousStageId:
          type: string
          format: uuid
          nullable: true
        orchestration:
          $ref: './orchestration.yaml'

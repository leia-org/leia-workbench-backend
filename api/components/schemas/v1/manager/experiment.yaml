type: object
description: Experiment payload as returned by the Manager service.
properties:
  id:
    type: string
    description: Unique identifier for the experiment.
  name:
    type: string
  leias:
    type: array
    items:
      $ref: './leia.yaml'
  orchestration:
    $ref: './orchestration.yaml'
  stages:
    type: array
    description: Ordered stage definitions. Absent on legacy activities.
    items:
      type: object
      properties:
        id:
          type: string
          format: uuid
        previousStageId:
          type: string
          format: uuid
          nullable: true
        outputSources:
          type: object
          properties:
            conversation:
              type: string
              nullable: true
            submitedSolution:
              type: string
              nullable: true
            problem:
              type: string
              nullable: true
        previousConversation:
          type: object
          description: Optional workbench configuration allowing students in stages n>1 to review an earlier stage conversation.
          properties:
            enabled:
              type: boolean
            sourceStageId:
              type: string
              nullable: true
            availability:
              type: string
              enum: [chat, editor, both]
        orchestration:
          $ref: './orchestration.yaml'

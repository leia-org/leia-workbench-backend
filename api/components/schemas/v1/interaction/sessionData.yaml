type: object
properties:
  nextStageAvailable:
    type: boolean
    description: Whether a completed execution can advance to its next stage.
  reflectiveAvailable:
    type: boolean
    description: The next LEIA can be started with the finished session's conversation context.
  session:
    $ref: './session.yaml'
  messages:
    type: array
    items:
      $ref: './message.yaml'
  stage:
    type: object
    description: Participant-safe content payload for static stages.
    properties:
      id:
        type: string
      type:
        type: string
      title:
        type: string
      content:
        type: string
  leia:
    $ref: '../manager/leia.yaml'
  replication:
    $ref: '../replication/replication.yaml'
  multiLeia:
    $ref: './multiLeia.yaml'

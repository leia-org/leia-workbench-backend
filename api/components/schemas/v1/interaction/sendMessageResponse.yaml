type: object
properties:
  message:
    type: string
    description: Final LEIA text response.
  toolCalls:
    type: array
    description: Tool calls the frontend must execute before continuing the turn.
    items:
      $ref: './toolCall.yaml'
  messages:
    type: array
    description: Ordered actor responses produced by a MultiLEIA traversal.
    items:
      $ref: './message.yaml'
  state:
    type: object
    additionalProperties: true
  partial:
    type: boolean
  nudge:
    type: string
    description: Optional supervisor nudge queued for the student.
oneOf:
  - required:
      - message
  - required:
      - toolCalls
  - required:
      - messages

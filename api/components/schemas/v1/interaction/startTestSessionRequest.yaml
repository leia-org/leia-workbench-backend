type: object
required:
  - replicationId
properties:
  replicationId:
    $ref: '../../mongoId.yaml'
  leiaId:
    $ref: '../../mongoId.yaml'
    nullable: true
    description: Required for a legacy single-LEIA test; omitted when multiLeia or stageFlow is true.
  stageFlow:
    type: boolean
    default: false
    description: Starts the complete stage sequence from its first stage.
  multiLeia:
    type: boolean
    default: false

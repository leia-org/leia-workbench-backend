type: object
additionalProperties: true
properties:
  stage:
    type: object
    required: [number, total, hasNext]
    properties:
      number:
        type: integer
        minimum: 1
      total:
        type: integer
        minimum: 1
      hasNext:
        type: boolean
  stagePlan:
    type: array
    description: Student-facing phases of each stage, in activity order. A null value means the phase depends on the assigned LEIA.
    items:
      type: object
      required: [askSolution, mode]
      properties:
        askSolution:
          type: boolean
          nullable: true
        mode:
          type: string
          enum: [conversation, transcription]
          nullable: true
  previousConversation:
    type: object
    description: Present when the current stage (n>1) enables the student Conversation viewer for an earlier stage.
    required: [enabled, stageNumber, availability]
    properties:
      enabled:
        type: boolean
      stageNumber:
        type: integer
        minimum: 1
      availability:
        type: string
        enum: [chat, both]
  conversationDynamics:
    $ref: './conversationDynamicsState.yaml'
  id:
    type: string
  startedAt:
    type: string
    format: date-time
  finishedAt:
    type: string
    format: date-time
    nullable: true
  result:
    type: string
    nullable: true
  evaluation:
    type: string
    nullable: true
  score:
    type: number
    nullable: true
  messages:
    type: array
    items:
      oneOf:
        - type: string
        - $ref: './message.yaml'
  replication:
    type: string
  leia:
    type: string
  leias:
    type: array
    items:
      type: string
  interactionMode:
    type: string
    enum: [single, multi]
  multiLeiaState:
    type: object
    additionalProperties: true
  user:
    nullable: true
    oneOf:
      - type: string
      - $ref: './user.yaml'
  isTest:
    type: boolean
  isRunnerInitialized:
    type: boolean
  draft:
    type: string
    nullable: true
  spectateUrl:
    type: string
    nullable: true
  spectateToken:
    type: string
    nullable: true
  spectateExpiresAt:
    type: string
    format: date-time
    nullable: true

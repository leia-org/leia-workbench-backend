type: object
additionalProperties: true
properties:
  previousSession:
    type: string
    description: Reference to the preceding session when this LEIA uses previous conversation context.
  reflectiveAvailable:
    type: boolean
    description: Whether the next LEIA in the activity uses this session's conversation context.
  id:
    type: string
  startedAt:
    type: string
    format: date-time
  finishedAt:
    type: string
    format: date-time
    nullable: true
  result:
    type: string
    nullable: true
  evaluation:
    type: string
    nullable: true
  score:
    type: number
    nullable: true
  messages:
    type: array
    items:
      oneOf:
        - type: string
        - $ref: './message.yaml'
  replication:
    type: string
  leia:
    type: string
  leias:
    type: array
    items:
      type: string
  interactionMode:
    type: string
    enum: [single, multi]
  multiLeiaState:
    type: object
    additionalProperties: true
  user:
    nullable: true
    oneOf:
      - type: string
      - $ref: './user.yaml'
  isTest:
    type: boolean
  isRunnerInitialized:
    type: boolean
  draft:
    type: string
    nullable: true
  spectateUrl:
    type: string
    nullable: true
  spectateToken:
    type: string
    nullable: true
  spectateExpiresAt:
    type: string
    format: date-time
    nullable: true

openapi: 3.0.3
info:
  title: LEIA Workbench API
  version: '1.0.0'
  description: LEIA Workbench API documentation
servers:
  - url: /api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []

tags:
  - name: Manager v1
    description: Manager API v1
  - name: Replications v1
    description: Replications API v1
  - name: Interactions v1
    description: Interactions API v1
  - name: Runner v1
    description: Runner API v1
  - name: Provider v1
    description: Provider API v1
  - name: Realtime v1
    description: Realtime API v1
  - name: Spectator v1
    description: Spectator API v1
  - name: Secret v1
    description: Admin secret API v1

paths:
  # Manager
  /v1/manager/experiments:
    $ref: './paths/v1/manager/experiments.yaml'
  /v1/manager/experiments/{id}:
    $ref: './paths/v1/manager/experiments-_id.yaml'

  # Replications
  /v1/replications:
    $ref: './paths/v1/replications/index.yaml'
  /v1/replications/{id}:
    $ref: './paths/v1/replications/_id.yaml'
  /v1/replications/{id}/name:
    $ref: './paths/v1/replications/_id-name.yaml'
  /v1/replications/{id}/toggle-active:
    $ref: './paths/v1/replications/_id-toggleActive.yaml'
  /v1/replications/{id}/toggle-repeatable:
    $ref: './paths/v1/replications/_id-toggleRepeatable.yaml'
  /v1/replications/{id}/toggle-shared:
    $ref: './paths/v1/replications/_id-toggleShared.yaml'
  /v1/replications/{id}/regenerate-share-token:
    $ref: './paths/v1/replications/_id-regenerateShareToken.yaml'
  /v1/replications/{id}/leia/{leiaId}/toggle-ask-solution:
    $ref: './paths/v1/replications/_id-leia-_leiaId-toggleAskSolution.yaml'
  /v1/replications/{id}/leia/{leiaId}/toggle-evaluate-solution:
    $ref: './paths/v1/replications/_id-leia-_leiaId-toggleEvaluateSolution.yaml'
  /v1/replications/{id}/regenerate-code:
    $ref: './paths/v1/replications/_id-regenerateCode.yaml'
  /v1/replications/{id}/duration:
    $ref: './paths/v1/replications/_id-duration.yaml'
  /v1/replications/{id}/experiment:
    $ref: './paths/v1/replications/_id-experiment.yaml'
  /v1/replications/{id}/leia/{leiaId}/runner-configuration:
    $ref: './paths/v1/replications/_id-leia-_leiaId-runnerConfiguration.yaml'
  /v1/replications/{id}/form:
    $ref: './paths/v1/replications/_id-form.yaml'
  /v1/replications/{id}/sessions/{sessionId}/score:
    $ref: './paths/v1/replications/_id-sessions-_sessionId-score.yaml'

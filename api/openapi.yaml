    $ref: './paths/v1/replications/_id-conversations-csv.yaml'
  /v1/replications/exists/{name}:
    $ref: './paths/v1/replications/exists-_name.yaml'

  # Interactions
  /v1/interactions:
    $ref: './paths/v1/interactions/index.yaml'
  /v1/interactions/test:
    $ref: './paths/v1/interactions/test.yaml'
  /v1/interactions/{sessionId}:
    $ref: './paths/v1/interactions/_sessionId.yaml'
  /v1/interactions/{sessionId}/messages:
    $ref: './paths/v1/interactions/_sessionId-messages.yaml'
  /v1/interactions/{sessionId}/result:
    $ref: './paths/v1/interactions/_sessionId-result.yaml'
  /v1/interactions/{sessionId}/finish:
    $ref: './paths/v1/interactions/_sessionId-finish.yaml'
  /v1/interactions/{sessionId}/evaluation:
    $ref: './paths/v1/interactions/_sessionId-evaluation.yaml'
  /v1/interactions/{sessionId}/solution:
    $ref: './paths/v1/interactions/_sessionId-solution.yaml'
  /v1/interactions/{sessionId}/draft:
    $ref: './paths/v1/interactions/_sessionId-draft.yaml'

  # Runner
  /v1/runner/models:
    $ref: './paths/v1/runner/models.yaml'

  # Provider
  /v1/provider:
    $ref: './paths/v1/provider/index.yaml'

  # Realtime
  /v1/realtime/session:
    $ref: './paths/v1/realtime/session.yaml'
  /v1/realtime/transcriptions/{sessionId}:
    $ref: './paths/v1/realtime/transcriptions-_sessionId.yaml'
  /v1/realtime/luke-token/{sessionId}:
    $ref: './paths/v1/realtime/luke-token-_sessionId.yaml'

  # Spectator
  /v1/spectator/sessions/{id}/token:
    $ref: './paths/v1/spectator/sessions-_id-token.yaml'
  /v1/spectator/sessions/{id}:
    $ref: './paths/v1/spectator/sessions-_id.yaml'
  /v1/spectator/replications/{id}/sessions:
    $ref: './paths/v1/spectator/replications-_id-sessions.yaml'

  # Secret
  /v1/secret:
    $ref: './paths/v1/secret/index.yaml'

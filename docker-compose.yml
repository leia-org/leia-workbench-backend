services:
  workbench-backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workbench-backend
    environment:
      - MONGO_URI=${MONGO_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - RUNNER_URL=${RUNNER_URL}
      - RUNNER_KEY=${RUNNER_KEY}
      - MANAGER_URL=${MANAGER_URL}
      - MANAGER_KEY=${MANAGER_KEY}
      - AUTH_URL=${AUTH_URL}
      - NODE_ENV=${NODE_ENV}
      - PORT=80
      - ADMIN_SECRET=${ADMIN_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LEIA_RECEIPT_PRIVATE_KEY_BASE64=${LEIA_RECEIPT_PRIVATE_KEY_BASE64}
      - LEIA_RECEIPT_PRIVATE_KEY_FILE=${LEIA_RECEIPT_PRIVATE_KEY_FILE}
      - LEIA_RECEIPT_KEY_ID=${LEIA_RECEIPT_KEY_ID}
      - LEIA_RECEIPT_ADDITIONAL_JWKS_JSON=${LEIA_RECEIPT_ADDITIONAL_JWKS_JSON}
      - PRAIRIELEARN_LAUNCH_PUBLIC_KEY_BASE64=${PRAIRIELEARN_LAUNCH_PUBLIC_KEY_BASE64}
      - PRAIRIELEARN_LAUNCH_PUBLIC_KEY_FILE=${PRAIRIELEARN_LAUNCH_PUBLIC_KEY_FILE}
      - PRAIRIELEARN_LAUNCH_KEY_ID=${PRAIRIELEARN_LAUNCH_KEY_ID}
      - PRAIRIELEARN_LAUNCH_JWKS_JSON=${PRAIRIELEARN_LAUNCH_JWKS_JSON}
      - PRAIRIELEARN_LAUNCH_JWKS_URL=${PRAIRIELEARN_LAUNCH_JWKS_URL}
      - PRAIRIELEARN_RECEIPT_ISSUER=${PRAIRIELEARN_RECEIPT_ISSUER:-leia-workbench}
      - PRAIRIELEARN_RECEIPT_AUDIENCE=${PRAIRIELEARN_RECEIPT_AUDIENCE:-prairielearn}
      - PRAIRIELEARN_LAUNCH_ISSUER=${PRAIRIELEARN_LAUNCH_ISSUER:-prairielearn}
      - PRAIRIELEARN_LAUNCH_AUDIENCE=${PRAIRIELEARN_LAUNCH_AUDIENCE:-leia-workbench}
    ports:
      - '${PORT}:80'
